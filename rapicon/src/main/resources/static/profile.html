<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Rapicon</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="https://mercury.phonepe.com/web/bundle/checkout.js"></script>
    <script src="scripts/showMessage.js"></script>
</head>
<body>

<!-- Header (same as other pages) -->
<header class="rc-header">
    <div class="rc-header-inner">
        <a href="/" class="rc-brand">
            <span class="rc-brand-mark">R</span>
            <span>
        <span class="rc-brand-name" style="display:block;">RAPICON</span>
        <span class="rc-brand-sub">Infrastructure</span>
      </span>
        </a>
        <ul class="rc-nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="designs.html">Designs</a></li>
            <li><a href="about-us.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="rc-header-actions">
            <a href="cart.html" class="rc-icon-btn" aria-label="Cart"><i data-lucide="shopping-cart" width="16" height="16"></i></a>
        </div>
        <button class="rc-nav-toggle" aria-label="Open menu">☰</button>
    </div>
</header>

<div class="rc-dash-layout">

    <!-- Sidebar -->
    <aside class="rc-dash-sidebar">
        <div class="rc-profile-mini">
            <div class="rc-profile-avatar" id="avatarInitial">–</div>
            <div class="rc-profile-name" id="userName">Loading…</div>
            <div class="rc-profile-email" id="userEmail"></div>
        </div>
        <nav class="rc-dash-nav">
            <button class="rc-dash-nav-link active" data-panel="panelProfile">
                <i data-lucide="user" width="15" height="15"></i> My Profile
            </button>
            <button class="rc-dash-nav-link" data-panel="panelOrders">
                <i data-lucide="package" width="15" height="15"></i> My Orders
            </button>
            <hr class="rc-dash-nav-divider">
            <button class="rc-dash-nav-link logout" id="logoutBtn">
                <i data-lucide="log-out" width="15" height="15"></i> Logout
            </button>
        </nav>
    </aside>

    <!-- Content -->
    <div>
        <div id="alertContainer"></div>

        <!-- ================= PROFILE PANEL ================= -->
        <div class="rc-dash-panel active" id="panelProfile">

            <div class="stats-container">
                <div class="stat-card" id="ordersStatCard">
                    <div class="stat-number" id="ordersStatNumber">0</div>
                    <div class="stat-label">Orders</div>
                </div>
            </div>

            <div class="profile-section">
                <div class="section-title">Personal Information</div>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Full Name</div>
                        <div class="info-value loading" id="fullName">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Email Address</div>
                        <div class="info-value loading" id="email">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Phone Number</div>
                        <div class="info-value loading" id="phone">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Member Since</div>
                        <div class="info-value loading" id="memberSince">—</div>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <div class="section-title">Address Details</div>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Street Address</div>
                        <div class="info-value loading" id="address">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">City</div>
                        <div class="info-value loading" id="city">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">State</div>
                        <div class="info-value loading" id="state">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Pin Code</div>
                        <div class="info-value loading" id="pincode">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Country</div>
                        <input
                                list="countryList"
                                id="country"
                                class="info-value"
                                placeholder="Select country"
                                disabled
                        />
                        <datalist id="countryList">
                            <option value="India">
                            <option value="United States">
                            <option value="United Kingdom">
                            <option value="Canada">
                            <option value="Australia">
                            <option value="Germany">
                            <option value="France">
                            <option value="Japan">
                            <option value="China">
                            <option value="Brazil">
                            <option value="South Africa">
                            <option value="Singapore">
                            <option value="UAE">
                            <option value="Saudi Arabia">
                            <option value="New Zealand">
                            <option value="Sri Lanka">
                            <option value="Bangladesh">
                            <option value="Nepal">
                            <option value="Bhutan">
                            <option value="Other">
                        </datalist>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="editProfileBtn">Edit Profile</button>
                <button class="btn btn-secondary" id="changePasswordBtn">Change Password</button>
                <button class="btn btn-logout" id="deleteBtn">Delete Account</button>
            </div>
        </div>

        <!-- ================= ORDERS PANEL ================= -->
        <div class="rc-dash-panel" id="panelOrders">
            <h1 class="rc-dash-panel-title">My Orders</h1>
            <div class="rc-orders-table-wrap">
                <table class="rc-orders-table">
                    <thead>
                    <tr>
                        <th>Order</th>
                        <th>Placed On</th>
                        <th>Status</th>
                        <th>Total</th>
                        <th>Paid</th>
                        <th>Installments</th>
                    </tr>
                    </thead>
                    <tbody id="orders"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="scripts/common.js"></script>
<script src="scripts/profile.js"></script>

</body>
</html>
